[package]
name = "openstack_sdk-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = [
  "dep:libfuzzer-sys",
  "dep:arbitrary",
  "dep:tempfile",
  "dep:openstack_sdk_core",
  "dep:openstack-sdk-auth-core",
  "dep:openstack-sdk-plugin-wasm",
  "openstack_sdk/fuzzing",
  "openstack_sdk_core/fuzzing",
  "openstack-sdk-auth-core/fuzzing",
  "openstack-sdk-plugin-wasm/fuzzing",
]

[package.metadata.dist]
dist = false

[dependencies]
arbitrary = { version = "1", features = ["derive"], optional = true }
bytes.workspace = true
http.workspace = true
libfuzzer-sys = { version = "0.4", optional = true }
openstack-sdk-auth-core = { workspace = true, optional = true }
openstack-sdk-plugin-wasm = { workspace = true, optional = true }
openstack_sdk_core = { workspace = true, optional = true }
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
url.workspace = true

[dependencies.openstack_sdk]
path = "../openstack_sdk"

[[bin]]
name = "fuzz_openstack_sdk_config"
path = "fuzz_targets/fuzz_openstack_sdk_config.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_openstack_sdk_config_yaml"
